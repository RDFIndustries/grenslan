[project]
name = "grenslan"
version = "0.1.0.dev0"
description = "Self-hosted research service providing attributable discovery, retrieval and processing over MCP and REST."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "RDF Industries, Inc." }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Direct runtime dependencies are pinned exactly; versions and licences are
# recorded in docs/implementation/FOUNDATION-VALIDATION.md. Transitive pins
# live in uv.lock.
dependencies = [
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "httpcore2==2.16.2",
    "anyio==4.16.0",
    # format-nongpl avoids the GPL-licensed rfc3987 pulled in by the "format" extra.
    "jsonschema[format-nongpl]==4.26.0",
    "pyyaml==6.0.4",
    # Local validation of MCP-compatible OAuth access tokens; "crypto" provides RS256 and ES256.
    "pyjwt[crypto]==2.15.1",
]

[project.urls]
Source = "https://github.com/RDFIndustries/grenslan"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20261122",
    # Test-only use of packages already locked transitively: TLS fixtures and HTTPS test client.
    "cryptography==50.0.2",
    "httpx2==2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.10,<0.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/support"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = ["integration: starts a real local HTTPS server"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# docs/ holds adopted declaration files and disposable preflight scripts, not package code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "PT", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["minimal_requests", "config_fixtures", "tls_fixtures", "ingress_fixtures", "jwt_fixtures"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# TypeAlias form is required: the aliases must compare equal to the adopted declarations.
"src/grenslan/providers/contract.py" = ["UP040"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
